[project]
name = "smart-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.81",
    "numpy>=2.2.3",
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "ta-lib>=0.6.4",
    "websocket-client>=1.8.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = ["smart_trader"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: 标记需要外部服务的集成测试（网络、API、数据库等）",
]
